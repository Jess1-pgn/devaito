# Database Configuration
# Fichier de configuration pour la connexion à la base de données MySQL

# Driver JDBC
db.driver=com.mysql.cj.jdbc.Driver

# URL de connexion
# Format: jdbc:mysql://[host]:[port]/[database_name]?[parameters]
db.url=jdbc:mysql://localhost:3306/DB_SDDI_ESTEM?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC

# Identifiants de connexion
db.username=root
db.password=

# Pool de connexions (optionnel - pour usage avancé)
db.pool.minSize=5
db.pool.maxSize=20

# Notes:
# - Modifiez db.username et db.password selon votre configuration MySQL
# - Pour des raisons de sécurité, ne commitez jamais ce fichier avec des mots de passe réels
# - En production, utilisez des variables d'environnement ou un gestionnaire de secrets
